apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "c8r.fullname" . }}-secrets-reader-binding
  labels:
    {{- include "c8r.labels" . | nindent 4 }}
roleRef:
  kind: Role
  name: {{ include "c8r.fullname" . }}-secrets-reader
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: {{ include "c8r.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
