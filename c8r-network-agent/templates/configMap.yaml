{{- /*
ConfigMap for c8r-network-agent server configuration
*/ -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "c8r.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "c8r.labels" . | nindent 4 }}
data:
  config.yaml: |
    metrics_port: {{ if .Values.metricsPortFromEnv }}${METRICS_PORT}{{ else }}{{ .Values.metrics.port }}{{ end }}
    grpc_port: {{ if .Values.grpcPortFromEnv }}${GRPC_PORT}{{ else }}{{ .Values.service.port }}{{ end }}
    environment: {{ if .Values.environmentFromEnv }}${ENVIRONMENT}{{ else }}{{ .Values.environment | quote }}{{ end }}
    cloud: {{ if .Values.cloudFromEnv }}${CLOUD}{{ else }}{{ .Values.cloud | quote }}{{ end }}
    region: {{ if .Values.regionFromEnv }}${REGION}{{ else }}{{ .Values.region | quote }}{{ end }}
    cluster: {{ if .Values.clusterFromEnv }}${CLUSTER}{{ else }}{{ .Values.cluster | quote }}{{ end }}
    max_grpc_connection_age: {{ if .Values.maxGRPCConnectionAgeFromEnv }}${MAX_GRPC_CONNECTION_AGE}{{ else }}{{ .Values.maxGRPCConnectionAge | quote }}{{ end }}
    num_exporter_workers: {{ if .Values.exporter.numWorkersFromEnv }}${NUM_EXPORTER_WORKERS}{{ else }}{{ .Values.exporter.numWorkers }}{{ end }}
    organisation_id: {{ if .Values.organisationIDFromEnv }}${ORGANISATION_ID}{{ else }}{{ .Values.organisationID | quote }}{{ end }}
    cluster_id: {{ if .Values.clusterIDFromEnv }}${CLUSTER_ID}{{ else }}{{ .Values.clusterID | quote }}{{ end }}
    {{- if or .Values.exporter.ignoreUDP .Values.exporter.ignoreUDPFromEnv }}
    ignore_udp: {{ if .Values.exporter.ignoreUDPFromEnv }}${IGNORE_UDP}{{ else }}{{ .Values.exporter.ignoreUDP }}{{ end }}
    {{- end }}
    {{- if or .Values.exporter.azureContainerURL .Values.exporter.azureContainerURLFromEnv }}
    azure_container_url: {{ if .Values.exporter.azureContainerURLFromEnv }}${AZURE_CONTAINER_URL}{{ else }}{{ .Values.exporter.azureContainerURL | quote }}{{ end }}
    {{- end }}
