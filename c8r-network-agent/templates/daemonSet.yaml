{{- /*
DaemonSet for c8r-network-agent agent component
*/ -}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "c8r.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "c8r.labels" . | nindent 4 }}
    {{- include "c8r.agentSelectorLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "c8r.agentSelectorLabels" . | nindent 6 }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "c8r.agentSelectorLabels" . | nindent 8 }}
      annotations:
        {{- include "c8r.configmap.checksum" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "c8r.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- if .Values.priorityClass.enabled }}
      priorityClassName: {{ include "c8r.priorityClassName" . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.initContainers.enableConntrack.enabled }}
      initContainers:
        - name: enable-conntrack
          image: {{ .Values.initContainers.enableConntrack.image }}
          imagePullPolicy: {{ .Values.initContainers.enableConntrack.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Enabling conntrack accounting..."
              if [ -f /proc/sys/net/netfilter/nf_conntrack_acct ]; then
                echo 1 > /proc/sys/net/netfilter/nf_conntrack_acct
                echo "Done. Current value: $(cat /proc/sys/net/netfilter/nf_conntrack_acct)"
              else
                echo "Warning: nf_conntrack_acct not found, conntrack module may not be loaded"
              fi
          securityContext:
            privileged: true
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
      {{- end }}
      containers:
        - name: agent
          image: {{ include "c8r.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - ./agent
          env:
            {{- include "c8r.agentEnv" . | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /live
              port: metrics
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            successThreshold: {{ .Values.probes.liveness.successThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources.agent | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      terminationGracePeriodSeconds: 30
