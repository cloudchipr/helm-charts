apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c8r.fullname" . }}-server
  labels:
    {{- include "c8r.labels" . | nindent 4 }}
    {{- include "c8r.serverSelectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  {{- with .Values.deployment.strategy }}
  strategy:
    {{- toYaml . | nindent 8 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "c8r.serverSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "c8r.serverSelectorLabels" . | nindent 8 }}
      annotations:
        {{- include "c8r.configmap.checksum" $ | nindent 8 }}
        {{- include "c8r.secret.checksum" $ | nindent 8 }}
    spec:
      containers:
        - name: {{ include "c8r.fullname" . }}-server
          env:
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: 1
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: 1
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - ./server
          livenessProbe:
            httpGet:
              path: /live
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 5
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /etc/kubenetmon/config.yaml
              name: config-volume
              subPath: config.yaml
            - mountPath: /etc/clickhouse
              name: clickhouse-credentials
      {{- with .Values.deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - configMap:
            name: {{ include "c8r.fullname" . }}-config
          name: config-volume
        - secret:
            secretName: {{ include "c8r.fullname" . }}-clickhouse-credentials
          name: clickhouse-credentials
      serviceAccountName: {{ include "c8r.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: 30
