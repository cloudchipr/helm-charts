# Production AWS environment values

environment: production
cloud: aws
region: us-east-1
cluster: prod-cluster

deployment:
  replicaCount: 5
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - c8r-network-agent-server
          topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: c8r-network-agent-server

resources:
  agent:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  server:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

exporter:
  numWorkers: 40
  ignoreUDP: true

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

serviceMonitors:
  enabled: true
  interval: 15s
  labels:
    release: prometheus

priorityClass:
  enabled: true
  value: 10001000
