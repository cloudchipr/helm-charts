# Default values for c8r-network-agent Helm chart

# =============================================================================
# GLOBAL CONFIGURATION
# =============================================================================

nameOverride: ""
fullnameOverride: ""

environment: development
cloud: ""
region: ""
cluster: ""

# =============================================================================
# IMAGE CONFIGURATION
# =============================================================================

image:
  repository: quay.io/cloudchipr/c8r-network-agent
  pullPolicy: IfNotPresent
  tag: "test_3"

imagePullSecrets: []

# =============================================================================
# SERVICE ACCOUNT CONFIGURATION
# =============================================================================

serviceAccount:
  create: true
  annotations: {}
  name: ""

automountServiceAccountToken: true

# =============================================================================
# POD CONFIGURATION
# =============================================================================

podAnnotations: {}
podSecurityContext: {}

securityContext:
  capabilities:
    add: ["NET_ADMIN"]
    drop: ["ALL"]
  runAsUser: 0
  readOnlyRootFilesystem: true

nodeSelector: {}
tolerations: []

# =============================================================================
# PRIORITY CLASS CONFIGURATION
# =============================================================================

priorityClass:
  enabled: true
  name: c8r-network-agent
  preemptionPolicy: PreemptLowerPriority
  value: 10001000
  description: "Priority class for c8r-network-agent to ensure pods are scheduled"

# =============================================================================
# SERVICE CONFIGURATION
# =============================================================================

service:
  type: ClusterIP
  port: 8874
  annotations: {}

# =============================================================================
# METRICS CONFIGURATION
# =============================================================================

metrics:
  enabled: true
  port: 8873

serviceMonitors:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# =============================================================================
# RESOURCE CONFIGURATION
# =============================================================================

resources:
  agent:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  server:
    limits:
      cpu: 2000m
      memory: 2512Mi
    requests:
      cpu: 500m
      memory: 1Gi

# =============================================================================
# AGENT (DAEMONSET) CONFIGURATION
# =============================================================================

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 50%

configuration:
  agent:
    collectionInterval: 5s
    skipConntrackSanityCheck: false
    serverServiceHost: ""
    serverServicePort: 8874
    uptimeWaitDuration: 300s

# =============================================================================
# SERVER (DEPLOYMENT) CONFIGURATION
# =============================================================================

deployment:
  replicaCount: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - c8r-network-agent-server
          topologyKey: kubernetes.io/hostname
  topologySpreadConstraints: []

maxGRPCConnectionAge: 300s

# =============================================================================
# EXPORTER CONFIGURATION
# =============================================================================

exporter:
  numWorkers: 20
  ignoreUDP: true
  azureContainerURL: ""
  azureContainerURLFromEnv: false

# =============================================================================
# PROBES CONFIGURATION
# =============================================================================

probes:
  liveness:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  readiness:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

# =============================================================================
# INIT CONTAINERS CONFIGURATION
# =============================================================================

initContainers:
  enableConntrack:
    enabled: true
    image: busybox:1.36
    imagePullPolicy: IfNotPresent

# =============================================================================
# EXTERNAL OBJECTS CONFIGURATION
# =============================================================================

# Add any additional Kubernetes objects dynamically
# Example:
# extraObjects:
#   - apiVersion: v1
#     kind: Secret
#     metadata:
#       name: my-secret
#     type: Opaque
#     stringData:
#       key: value
#   - apiVersion: v1
#     kind: ConfigMap
#     metadata:
#       name: my-extra-config
#     data:
#       foo: bar

extraObjects: []

# =============================================================================
# GLOBAL ENVIRONMENT VARIABLES (applies to both agent and server)
# =============================================================================

# Additional environment variables
# Example:
# env:
#   - name: LOG_LEVEL
#     value: "debug"
#   - name: MY_SECRET_VAR
#     valueFrom:
#       secretKeyRef:
#         name: my-secret
#         key: secret-key
env: []

# Environment variables from ConfigMaps or Secrets
# Example:
# envFrom:
#   - secretRef:
#       name: azure-credentials
#   - configMapRef:
#       name: my-config
envFrom: []
