# development azure environment values
environment: development
cloud: azure
region: westus2
cluster: c8r-dev

clusterID: "793460b7-76e0-4685-9ca2-acae9341a5dc"
clusterIDFromEnv: false

organisationIDFromEnv: true

image:
  repository: quay.io/cloudchipr/c8r-network-agent
  pullPolicy: IfNotPresent
  tag: "v0.1.3-alpha"

deployment:
  replicaCount: 2

resources:
  agent:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  server:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

exporter:
  numWorkers: 40
  ignoreUDP: true
  azureContainerURLFromEnv: true

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

serviceMonitors:
  enabled: true
  interval: 15s

priorityClass:
  enabled: true
  value: 10001000

extraObjects:
  - apiVersion: external-secrets.io/v1beta1
    kind: ExternalSecret
    metadata:
      name: c8r-network-agent-environment
    spec:
      dataFrom:
        - extract:
            conversionStrategy: Default
            decodingStrategy: None
            key: kv-staging/saas/microservices/c8r-network-agent-environment
            metadataPolicy: None
      refreshInterval: 15s
      secretStoreRef:
        kind: ClusterSecretStore
        name: saas-secrets-vault
      target:
        creationPolicy: Owner
        deletionPolicy: Retain

envFrom:
  - secretRef:
      name: c8r-network-agent-environment

podAnnotations:
  secret.reloader.stakater.com/reload: c8r-network-agent-environment
